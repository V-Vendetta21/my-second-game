<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Star Catcher</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#04050f;font-family:'Segoe UI',system-ui,sans-serif}
  #c{display:block;position:fixed;inset:0;cursor:default;touch-action:none}
  #vig{position:fixed;inset:0;pointer-events:none;z-index:2;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.45) 100%)}
  #grade{position:fixed;inset:0;pointer-events:none;z-index:1;mix-blend-mode:overlay;background:linear-gradient(180deg,rgba(80,120,220,.07) 0%,rgba(40,60,120,.04) 50%,rgba(20,30,60,.08) 100%)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vig"></div>
<div id="grade"></div>
<script>
'use strict';
/* ================= setup ================= */
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=innerWidth,H=innerHeight,DPR=Math.min(devicePixelRatio||1,2);
let tNow=0,mode='menu',paused=false;
let mx=-999,my=-999;
function resize(){
  W=innerWidth;H=innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  cv.style.width=W+'px';cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  layout();layoutDiff();layoutEnd();
}
function dist(x1,y1,x2,y2){return Math.hypot(x1-x2,y1-y2);}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function star(g,x,y,r,rot,inner){g.beginPath();for(let i=0;i<10;i++){const a=rot+i*Math.PI/5,rad=i%2?r*(inner||.45):r;const px=x+Math.cos(a)*rad,py=y+Math.sin(a)*rad;i?g.lineTo(px,py):g.moveTo(px,py);}g.closePath();}
function heart(g,x,y,s){g.beginPath();g.moveTo(x,y+s*.9);g.bezierCurveTo(x-s*1.1,y-s*.1,x-s*.7,y-s*1.05,x,y-s*.4);g.bezierCurveTo(x+s*.7,y-s*1.05,x+s*1.1,y-s*.1,x,y+s*.9);g.closePath();}
function shade(hex,f){const n=parseInt(hex.slice(1),16),r=Math.max(0,Math.min(255,(n>>16)&255)*f),g2=Math.max(0,Math.min(255,(n>>8)&255)*f),b=Math.max(0,Math.min(255,n&255)*f);return 'rgb('+Math.round(r)+','+Math.round(g2)+','+Math.round(b)+')';}

/* ================= heroes ================= */
const HEROES=[
  {id:'tank',name:'Tank',accent:'#8fc0ff',glow:[110,160,255],desc:'Huge reach, heavy frame',speed:250,radius:46,stats:[.3,1,.95]},
  {id:'bolt',name:'Bolt',accent:'#ffd54a',glow:[255,200,60],desc:'Blistering speed',speed:450,radius:26,stats:[1,.4,.35]},
  {id:'rock',name:'Rock',accent:'#e0b97c',glow:[220,170,90],desc:'Fires cone rock volleys',speed:335,radius:32,stats:[.6,.6,.75]}
];
const R0=72;
let sel=-1;
const hoverAmt=[0,0,0];
function canvasOf(fn,R){const s=Math.ceil(R*2+20),c=document.createElement('canvas');c.width=c.height=s;const g=c.getContext('2d');g.translate(s/2,s/2);fn(g,R);return c;}
function drawTank(g,R){
  const grd=g.createRadialGradient(-R*.35,-R*.4,R*.1,0,0,R);
  grd.addColorStop(0,'#9db8d9');grd.addColorStop(.55,'#4a6a96');grd.addColorStop(1,'#243a5c');
  g.beginPath();g.arc(0,0,R,0,7);g.fillStyle=grd;g.fill();
  g.lineWidth=R*.08;g.strokeStyle='#18283f';g.stroke();
  g.beginPath();g.arc(0,0,R*.8,0,7);g.lineWidth=R*.045;g.strokeStyle='rgba(255,255,255,.16)';g.stroke();
  for(let i=0;i<8;i++){const a=i/8*6.283;g.beginPath();g.arc(Math.cos(a)*R*.8,Math.sin(a)*R*.8,R*.05,0,7);g.fillStyle='#16263e';g.fill();}
  rr(g,-R*.56,-R*.15,R*1.12,R*.3,R*.15);g.fillStyle='#0d1626';g.fill();
  g.fillStyle='#8fe3ff';g.beginPath();g.arc(-R*.24,0,R*.07,0,7);g.fill();g.beginPath();g.arc(R*.24,0,R*.07,0,7);g.fill();
  g.strokeStyle='#0d1626';g.lineWidth=R*.05;g.beginPath();g.moveTo(-R*.22,R*.3);g.lineTo(R*.22,R*.3);g.stroke();
}
function drawBolt(g,R){
  const grd=g.createRadialGradient(-R*.3,-R*.35,R*.1,0,0,R);
  grd.addColorStop(0,'#fff6c8');grd.addColorStop(.5,'#ffce3d');grd.addColorStop(1,'#e08a00');
  g.beginPath();g.arc(0,0,R,0,7);g.fillStyle=grd;g.fill();
  g.lineWidth=R*.08;g.strokeStyle='#8a5a00';g.stroke();
  g.save();g.shadowColor='rgba(255,220,90,.9)';g.shadowBlur=R*.35;
  g.fillStyle='#fff9dc';g.strokeStyle='#8a5a00';g.lineWidth=R*.05;
  g.beginPath();
  const b=R*.52;
  g.moveTo(-b*.15,-b);g.lineTo(-b*.55,b*.05);g.lineTo(-b*.05,b*.05);g.lineTo(-b*.45,b);g.lineTo(b*.6,-b*.3);g.lineTo(b*.08,-b*.3);g.lineTo(b*.3,-b);g.closePath();
  g.fill();g.stroke();
  g.restore();
  g.strokeStyle='#fff';g.lineWidth=R*.045;
  for(const s of [[-R*.72,-R*.6],[R*.74,-R*.55]]){
    g.beginPath();g.moveTo(s[0]-R*.08,s[1]);g.lineTo(s[0]+R*.08,s[1]);g.stroke();
    g.beginPath();g.moveTo(s[0],s[1]-R*.08);g.lineTo(s[0],s[1]+R*.08);g.stroke();
  }
}
function drawRock(g,R){
  const grd=g.createRadialGradient(-R*.3,-R*.35,R*.1,0,0,R);
  grd.addColorStop(0,'#d8b88a');grd.addColorStop(.5,'#a98760');grd.addColorStop(1,'#6b5136');
  const pts=16,rads=[];
  for(let i=0;i<pts;i++)rads.push(R*(0.9+0.12*Math.sin(i*2.7+1.3)+0.06*Math.cos(i*1.3)));
  g.beginPath();
  for(let i=0;i<=pts;i++){const a=i/pts*6.283,r2=rads[i%pts],px=Math.cos(a)*r2,py=Math.sin(a)*r2;i?g.lineTo(px,py):g.moveTo(px,py);}
  g.closePath();g.fillStyle=grd;g.fill();
  g.lineWidth=R*.07;g.strokeStyle='#4c3a24';g.stroke();
  g.strokeStyle='rgba(60,42,20,.85)';g.lineWidth=R*.04;
  g.beginPath();g.moveTo(-R*.5,-R*.15);g.lineTo(-R*.15,R*.05);g.lineTo(-R*.3,R*.4);g.stroke();
  g.beginPath();g.moveTo(R*.45,-R*.35);g.lineTo(R*.15,-R*.05);g.lineTo(R*.5,R*.1);g.stroke();
  g.fillStyle='#ffb84d';g.beginPath();g.arc(-R*.28,-R*.12,R*.09,0,7);g.fill();g.beginPath();g.arc(R*.28,-R*.12,R*.09,0,7);g.fill();
  g.fillStyle='#3a2a14';g.beginPath();g.arc(-R*.25,-R*.12,R*.05,0,7);g.fill();g.beginPath();g.arc(R*.31,-R*.12,R*.05,0,7);g.fill();
  g.strokeStyle='#3a2a14';g.lineWidth=R*.045;g.beginPath();g.moveTo(-R*.2,R*.22);g.lineTo(R*.2,R*.22);g.stroke();
  g.fillStyle='rgba(96,140,70,.55)';g.beginPath();g.arc(R*.5,R*.55,R*.28,0,7);g.fill();
}
const heroImg=[canvasOf(drawTank,R0),canvasOf(drawBolt,R0),canvasOf(drawRock,R0)];

/* ================= planets & difficulties ================= */
const DIFFS=[
  {id:'easy',name:'EASY',accent:'#7dd87d',glow:[110,220,130],spawn:.95,fall:100,fallVar:70,targets:[10,18,28]},
  {id:'med',name:'MEDIUM',accent:'#ffb84d',glow:[255,180,80],spawn:.72,fall:150,fallVar:80,targets:[16,28,40]},
  {id:'hard',name:'HARD',accent:'#ff6d7d',glow:[255,100,120],spawn:.5,fall:215,fallVar:90,targets:[22,38,55]}
];
const PLANETS=[
  {name:'VERDANT',col:'#58c98f',sky:[20,60,45]},
  {name:'AQUA',col:'#4fc3e8',sky:[20,50,65]},
  {name:'VIOLET',col:'#a97ce8',sky:[45,30,65]},
  {name:'EMBER',col:'#ff9d3d',sky:[60,40,20]},
  {name:'CRIMSON',col:'#ff5d6c',sky:[65,25,30]},
  {name:'TEAL',col:'#3dd9c4',sky:[15,55,55]},
  {name:'NOVA',col:'#ffd54a',sky:[60,55,20]},
  {name:'VOID',col:'#8d7bff',sky:[35,25,65]},
  {name:'INFERNO',col:'#ff5ec8',sky:[65,25,50]}
];
let diffIdx=0,planetIdx=0;
let progress={easy:0,med:0,hard:0};
try{const p=JSON.parse(localStorage.getItem('starcatcher_progress')||'{}');if(p.easy)progress.easy=p.easy;if(p.med)progress.med=p.med;if(p.hard)progress.hard=p.hard;}catch(e){}

/* planet orb canvases */
function planetCanvas(col){
  const r=30,s=r*2+18,c=document.createElement('canvas');c.width=c.height=s;
  const g=c.getContext('2d');g.translate(s/2,s/2);
  const grd=g.createRadialGradient(-r*.35,-r*.4,r*.1,0,0,r);
  grd.addColorStop(0,'#ffffff');grd.addColorStop(.28,shade(col,1.25));grd.addColorStop(.6,col);grd.addColorStop(1,shade(col,.45));
  g.beginPath();g.arc(0,0,r,0,7);g.fillStyle=grd;g.fill();
  g.lineWidth=2;g.strokeStyle='rgba(255,255,255,.35)';g.stroke();
  for(let i=0;i<5;i++){const a=Math.random()*6.283,d=r*(.3+Math.random()*.5);g.beginPath();g.arc(Math.cos(a)*d,Math.sin(a)*d,2+Math.random()*3.5,0,7);g.fillStyle='rgba(0,0,0,.22)';g.fill();}
  g.save();g.globalAlpha=.5;g.strokeStyle='rgba(255,255,255,.55)';g.lineWidth=3.5;
  g.beginPath();g.ellipse(0,0,r*1.28,r*.42,-.35,0,7);g.stroke();g.restore();
  g.fillStyle='rgba(255,255,255,.4)';g.beginPath();g.ellipse(-r*.35,-r*.4,r*.4,r*.22,-.6,0,7);g.fill();
  return c;
}
const planetImg=PLANETS.map(p=>planetCanvas(p.col));
function drawLock(g,x,y,s){
  g.strokeStyle='rgba(185,195,215,.75)';g.lineWidth=s*.16;g.lineCap='round';
  g.beginPath();g.arc(x,y-s*.3,s*.27,Math.PI,0);g.stroke();
  g.fillStyle='rgba(185,195,215,.75)';rr(g,x-s*.34,y-s*.18,s*.68,s*.52,s*.09);g.fill();
}

/* ================= layout ================= */
let m={R:66,gap:230,cy:0,cxs:[0,0,0],btn:{x:0,y:0,w:260,h:64},hintY:0};
let diffCards=[],backBtn={x:14,y:14,w:104,h:40},diffHov=-1;
let btns=[];
function layout(){
  m.R=Math.max(40,Math.min(78,W/6.4,H*.105));
  m.gap=m.R*3.4;
  m.cy=H*.47;
  for(let i=0;i<3;i++)m.cxs[i]=W/2+(i-1)*m.gap;
  const bw=Math.min(280,W*.8),bh=64;
  m.btn={x:W/2-bw/2,y:H-150,w:bw,h:bh};
  m.hintY=H-76;
}
function layoutDiff(){
  backBtn={x:14,y:14,w:104,h:40};
  diffCards=[];
  const wide=W>=740;
  if(wide){
    const cw=Math.min(216,(W-90)/3),ch=Math.min(292,H-250),gap=14;
    const x0=Math.max(8,(W-(cw*3+gap*2))/2),y0=Math.max(148,H*.30);
    for(let i=0;i<3;i++)diffCards.push({x:x0+i*(cw+gap),y:y0,w:cw,h:ch});
  }else{
    const cw=Math.min(W-48,230),ch=Math.min(150,(H-190)/3),gap=10;
    const x0=(W-cw)/2,y0=142;
    for(let i=0;i<3;i++)diffCards.push({x:x0,y:y0+i*(ch+gap),w:cw,h:ch});
  }
}
function layoutEnd(){
  if((mode!=='over'&&mode!=='clear')||btns.length<2)return;
  const cw=250,ch=54,gap=12,n=btns.length;
  const total=n*ch+(n-1)*gap,y0=H*.56;
  for(let i=0;i<n;i++){btns[i].x=W/2-cw/2;btns[i].y=y0+i*(ch+gap);btns[i].w=cw;btns[i].h=ch;}
}
function hitBtn(b,x,y){return x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h;}

/* ================= sky ================= */
const bgStars=[],specks=[],shooters=[];
let shooterT=2;
function initSky(){
  bgStars.length=0;specks.length=0;shooters.length=0;
  for(let i=0;i<140;i++)bgStars.push({x:Math.random()*W,y:Math.random()*H,r:.5+Math.random()*1.4,ph:Math.random()*6.283,sp:.5+Math.random()*2,tw:.4+Math.random()*1.6});
  for(let i=0;i<46;i++)specks.push({x:Math.random()*W,y:Math.random()*H,r:.4+Math.random()*1.1,vy:22+Math.random()*60,a:.15+Math.random()*.35,ph:Math.random()*6.283});
}
function updateSky(dt){
  for(const s of specks){s.y+=s.vy*dt;if(s.y>H+4){s.y=-4;s.x=Math.random()*W;}}
  shooterT-=dt;
  if(shooterT<=0){shooterT=2.2+Math.random()*3.2;shooters.push({x:W*.2+Math.random()*W*.7,y:Math.random()*H*.3,vx:-(180+Math.random()*160),vy:90+Math.random()*70,life:1.6});}
  for(let i=shooters.length-1;i>=0;i--){const s=shooters[i];s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;if(s.life<=0||s.x<-80||s.y>H+60)shooters.splice(i,1);}
}
function skyTint(){
  if(mode==='play'||mode==='clear'||mode==='over')return PLANETS[planetIdx].sky;
  return null;
}
function drawSky(){
  const tint=skyTint();
  const mid=tint?'rgb('+Math.round(tint[0]*.3)+','+Math.round(tint[1]*.3)+','+Math.round(tint[2]*.3)+')':'#0a0d24';
  const bot=tint?'rgb('+Math.round(tint[0]*.55)+','+Math.round(tint[1]*.55)+','+Math.round(tint[2]*.55)+')':'#10143a';
  const grd=ctx.createLinearGradient(0,0,0,H);
  grd.addColorStop(0,'#05070f');grd.addColorStop(.55,mid);grd.addColorStop(1,bot);
  ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);
  for(let i=0;i<3;i++){const nx=(.15+i*.33)*W,ny=(.18+i*.26)*H;const ng=ctx.createRadialGradient(nx,ny,10,nx,ny,220+i*70);ng.addColorStop(0,tint?'rgba('+tint[0]+','+tint[1]+','+tint[2]+',.07)':'rgba(70,90,190,.06)');ng.addColorStop(1,'rgba(70,90,190,0)');ctx.fillStyle=ng;ctx.fillRect(nx-300,ny-300,600,600);}
  for(const s of bgStars){const a=.3+.7*(.5+.5*Math.sin(tNow*s.sp+s.ph))*s.tw*.5;ctx.globalAlpha=Math.min(1,a);ctx.fillStyle='#cfe0ff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill();}
  ctx.globalAlpha=1;
  for(const s of specks){const a=s.a*(.5+.5*Math.sin(tNow*2+s.ph));ctx.globalAlpha=a;ctx.fillStyle='#bfd0ff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill();}
  ctx.globalAlpha=1;
  for(const s of shooters){
    const a=Math.min(1,s.life);
    const g=ctx.createLinearGradient(s.x,s.y,s.x-s.vx*.16,s.y-s.vy*.16);
    g.addColorStop(0,'rgba(220,235,255,0)');g.addColorStop(1,'rgba(255,255,255,'+(.9*a)+')');
    ctx.strokeStyle=g;ctx.lineWidth=2;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(s.x-s.vx*.16,s.y-s.vy*.16);ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,'+a+')';ctx.beginPath();ctx.arc(s.x,s.y,2.2,0,7);ctx.fill();
  }
}

/* ================= audio ================= */
let AC=null,muted=false;
function ac(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC;}
function tone(f,d,type,v,slide){if(muted)return;const c=ac(),o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,c.currentTime);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),c.currentTime+d);g.gain.setValueAtTime(v||.14,c.currentTime);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+d);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d+.02);}

/* ================= fx ================= */
let parts=[],floats=[];
function burst(x,y,color,n){
  for(let i=0;i<n;i++){
    const a=Math.random()*6.283,sp=60+Math.random()*220;
    parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:1.5+Math.random()*2.6,life:.4+Math.random()*.5,max:0,color,type:Math.random()<.25?'star':'dot',rot:Math.random()*6.283,vr:(Math.random()-.5)*8});
  }
}
function float(x,y,text,color,life,size){floats.push({x,y,text,color,life:life||1.2,max:life||1.2,size:size||16});}
function updateFx(dt){
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.max=p.max||p.life;p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=260*dt;p.rot+=p.vr*dt;if(p.life<=0)parts.splice(i,1);}
  for(let i=floats.length-1;i>=0;i--){const f=floats[i];f.life-=dt;f.y-=32*dt;if(f.life<=0)floats.splice(i,1);}
}
function drawFx(){
  for(const p of parts){const a=Math.max(0,p.life/p.max);ctx.globalAlpha=a;ctx.fillStyle=p.color;if(p.type==='star'){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);star(ctx,0,0,p.r*2.2,0,.45);ctx.fill();ctx.restore();}else{ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();}}
  ctx.globalAlpha=1;
  for(const f of floats){ctx.globalAlpha=Math.min(1,f.life);ctx.fillStyle=f.color;ctx.font="800 "+f.size+"px 'Segoe UI',system-ui,sans-serif";ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(f.text,f.x,f.y);}
  ctx.globalAlpha=1;
}

/* ================= menu ================= */
function selectHero(i){
  sel=i;tone(520,.09,'sine',.15);tone(780,.12,'sine',.12,.1);
  burst(m.cxs[i],m.cy,HEROES[i].accent,14);
}
function drawStatBars(x,y,stats,accent){
  const labels=['SPD','RCH','DEF'],bw=96,seg=8,gap=3;
  ctx.textAlign='left';ctx.textBaseline='middle';
  for(let i=0;i<3;i++){
    const lx=x-bw/2,ly=y+i*12;
    ctx.fillStyle='#5a6a90';ctx.font="700 8px 'Segoe UI',system-ui,sans-serif";ctx.letterSpacing='1px';
    ctx.fillText(labels[i],lx,ly);ctx.letterSpacing='0px';
    const filled=Math.round(stats[i]*5);
    for(let j=0;j<5;j++){ctx.fillStyle=j<filled?accent:'rgba(255,255,255,.12)';rr(ctx,lx+30+j*(seg+gap),ly-3.5,seg,7,2);ctx.fill();}
  }
}
function drawMenu(){
  drawSky();
  const fs=Math.min(58,W*.08,H*.12);
  const ty=Math.max(66,H*.15);
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle='#eaf2ff';ctx.font="800 "+fs+"px 'Segoe UI',system-ui,sans-serif";ctx.letterSpacing='6px';
  ctx.fillText('STAR CATCHER',W/2,ty);
  ctx.letterSpacing='0px';
  const gx=fs*2.7;
  for(const sgn of [-1,1]){
    const sx=W/2+gx*sgn;
    ctx.save();ctx.translate(sx,ty);ctx.rotate(tNow*.8*sgn);
    ctx.fillStyle='#ffd54a';ctx.shadowColor='rgba(255,200,70,.9)';ctx.shadowBlur=16;
    star(ctx,0,0,11,-Math.PI/2,.45);ctx.fill();
    ctx.restore();
  }
  if(H>430){ctx.fillStyle='#8fa3c8';ctx.font="600 14px 'Segoe UI',system-ui,sans-serif";ctx.letterSpacing='4px';ctx.fillText('CHOOSE YOUR HERO',W/2,ty+fs*.72);ctx.letterSpacing='0px';}
  for(let i=0;i<3;i++){
    const cx=m.cxs[i],cy=m.cy+Math.sin(tNow*1.3+i*2.1)*5;
    const hv=hoverAmt[i],ss=1+.12*hv;
    const Rr=m.R*ss,ly=cy-8*hv;
    const col=HEROES[i];
    ctx.save();
    ctx.globalAlpha=.25+.2*hv;ctx.fillStyle='#000';
    ctx.beginPath();ctx.ellipse(cx,cy+Rr*1.08,Rr*.9,Rr*.22,0,0,7);ctx.fill();
    ctx.globalAlpha=1;
    const pulse=.12+.1*Math.sin(tNow*2.4+i);

/* ================= game ================= */
const BASE_TOP=44;
let P={x:W/2,y:H-120,r:36,sp:300,img:heroImg[0]};
let stars=[],projs=[],fireT=0;
let score=0,baseHP=10,starsCaught=0,target=10,combo=0,comboT=0,best=0,spawnT=.7,runT=0,flashT=0,missT=0,scorePop=0,overAt=0,newBest=false;
let keys={},touch=null;
try{best=parseInt(localStorage.getItem('starcatcher_best'))||0;}catch(e){}
function startLevel(d,p){
  ac();diffIdx=d;planetIdx=p;mode='play';paused=false;
  score=0;baseHP=10;starsCaught=0;combo=0;comboT=0;stars.length=0;projs.length=0;parts.length=0;floats.length=0;
  target=DIFFS[d].targets[p];
  runT=0;spawnT=.7;flashT=0;missT=0;scorePop=0;newBest=false;fireT=.8;
  const pr=HEROES[sel].radius;

  btns=[];

  tone(440,.12,'sine',.15);tone(660,.16,'sine',.13,.1);
}
function completeLevel(){
  mode='clear';overAt=tNow;
  progress[DIFFS[diffIdx].id]=Math.max(progress[DIFFS[diffIdx].id]||0,planetIdx+1);
  try{localStorage.setItem('starcatcher_progress',JSON.stringify(progress));}catch(e){}
  newBest=score>best;
  if(newBest){best=score;try{localStorage.setItem('starcatcher_best',String(best));}catch(e){}}
  btns=[];
  if(planetIdx<2)btns.push({label:'NEXT PLANET',x:0,y:0,w:250,h:54,cb:()=>startLevel(diffIdx,planetIdx+1)});
  btns.push({label:'PLANETS',x:0,y:0,w:250,h:54,cb:showDiff});
  layoutEnd();
  burst(W/2,H*.4,'#ffd54a',40);burst(W/2,H*.4,'#ffffff',24);
  tone(660,.1,'triangle',.15);setTimeout(()=>tone(880,.12,'triangle',.14,.05),120);setTimeout(()=>tone(1320,.22,'triangle',.13,.05),260);
}
function gameOver(){
  mode='over';overAt=tNow;
  newBest=score>best;
  if(newBest){best=score;try{localStorage.setItem('starcatcher_best',String(best));}catch(e){}}
  btns=[{label:'RETRY PLANET',x:0,y:0,w:250,h:54,cb:()=>startLevel(diffIdx,planetIdx)},{label:'PLANETS',x:0,y:0,w:250,h:54,cb:showDiff},{label:'CHANGE HERO',x:0,y:0,w:250,h:54,cb:toMenu}];
  layoutEnd();
  tone(520,.15,'sawtooth',.13,-80);
  setTimeout(()=>{tone(330,.18,'sawtooth',.12,-60);setTimeout(()=>tone(180,.4,'sawtooth',.13,-60),180);},160);
}
function spawnStar(){
  const d=DIFFS[diffIdx];
  const roll=Math.random();
  let type='n';
  if(roll<.07)type='gold';
  else if(roll<.1)type='heart';
  const r=type==='gold'?24:type==='heart'?18:13+Math.random()*7;
  const base=d.fall+Math.min(140,runT*1.2);
  const vy=(base*(.85+Math.random()*.5))*(type==='gold'?1.15:1);
  stars.push({x:r+20+Math.random()*(W-2*r-40),y:-30,r,vy,vx:(Math.random()-.5)*30,rot:Math.random()*6.283,vr:(Math.random()-.5)*2.4,type});
}
function onCatch(s){
  combo=Math.min(9,combo+1);comboT=2.5;scorePop=.25;
  starsCaught++;
  if(s.type==='gold'){
    const pts=50*combo;score+=pts;
    float(s.x,s.y,'+'+pts,'#ffd54a');
    burst(s.x,s.y,'#ffd54a',26);
    tone(660,.09,'triangle',.16);tone(880,.12,'triangle',.16,.05);tone(1320,.16,'triangle',.13,.05);
  }else if(s.type==='heart'){
    baseHP=Math.min(10,baseHP+1);
    float(s.x,s.y,'+1 HP','#ff7d8a');
    burst(s.x,s.y,'#ff7d8a',20);
    tone(440,.12,'sine',.16);tone(660,.16,'sine',.13,.1);
  }else{
    const pts=10*combo;score+=pts;
    float(s.x,s.y,'+'+pts,'#cfe0ff');
    burst(s.x,s.y,'#aed0ff',12);
    tone(500+combo*45,.07,'triangle',.14);
  }
  if(starsCaught>=target)completeLevel();
}
function onLeak(x){
  baseHP--;combo=0;flashT=.28;missT=1.2;
  tone(220,.22,'sawtooth',.12,-140);
  float(x,H-BASE_TOP-26,'LEAK','#ff5d6c',1.1,18);
  burst(x,H-BASE_TOP,'#ff5d6c',14);
  if(baseHP<=0)gameOver();
}
function updatePlay(dt){
  runT+=dt;
  if(scorePop>0)scorePop-=dt;
  if(flashT>0)flashT-=dt;
  if(missT>0)missT-=dt;
  if(comboT>0){comboT-=dt;if(comboT<=0)combo=0;}
  spawnT-=dt;
  if(spawnT<=0){spawnStar();spawnT=Math.max(.3,DIFFS[diffIdx].spawn-runT*.004);}
  let mvx=0,mvy=0;
  if(keys['ArrowLeft']||keys['a'])mvx-=1;
  if(keys['ArrowRight']||keys['d'])mvx+=1;
  if(keys['ArrowUp']||keys['w'])mvy-=1;
  if(keys['ArrowDown']||keys['s'])mvy+=1;
  if(touch){
    const dx=touch.x-P.x,dy=touch.y-P.y,mm=Math.hypot(dx,dy);
    if(mm>8){mvx=dx/mm*P.sp*1.3;mvy=dy/mm*P.sp*1.3;}else{mvx=0;mvy=0;}
  }else if(mvx||mvy){
    const mm=Math.hypot(mvx,mvy);mvx/=mm;mvy/=mm;
    mvx*=P.sp;mvy*=P.sp;
  }
  P.x+=mvx*dt;P.y+=mvy*dt;
  P.x=Math.max(P.r+8,Math.min(W-P.r-8,P.x));
  P.y=Math.max(H*.3,Math.min(H-BASE_TOP-P.r-8,P.y));
  /* rock cone volley */
  if(HEROES[sel].id==='rock'){
    fireT-=dt;
    if(fireT<=0){
      fireT=1.0;
      const pr=P.r*.25;
      for(let k=-1;k<=1;k++){
        const a=-Math.PI/2+k*.28;
        projs.push({x:P.x,y:P.y-P.r-8,vx:Math.cos(a)*215,vy:Math.sin(a)*215,r:pr,life:1.6,rot:0,vr:7});
      }
      tone(300,.05,'square',.045);
    }
  }
  for(let i=projs.length-1;i>=0;i--){
    const p=projs[i];
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;p.life-=dt;
    if(p.life<=0||p.y<-40||p.x<-40||p.x>W+40){projs.splice(i,1);continue;}
    for(let j=stars.length-1;j>=0;j--){
      const s=stars[j];
      if(dist(p.x,p.y,s.x,s.y)<p.r+s.r*.7){stars.splice(j,1);onCatch(s);}
    }
  }
  for(let i=stars.length-1;i>=0;i--){
    const s=stars[i];
    s.y+=s.vy*dt;s.x+=s.vx*dt;s.rot+=s.vr*dt;
    if(s.y>H-BASE_TOP+6){stars.splice(i,1);onLeak(s.x);continue;}
    if(dist(P.x,P.y,s.x,s.y)<P.r+s.r*.7){stars.splice(i,1);onCatch(s);}
  }
}
function updateEnd(dt){
  for(let i=stars.length-1;i>=0;i--){const s=stars[i];s.y+=s.vy*dt;s.x+=s.vx*dt;s.rot+=s.vr*dt;if(s.y>H+50)stars.splice(i,1);}
  for(let i=projs.length-1;i>=0;i--){const p=projs[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0||p.y<-40||p.x<-40||p.x>W+40)projs.splice(i,1);}
}

  ctx.fillStyle='rgba(255,255,255,.06)';rr(ctx,bx-bw/2-2,by-2,bw+4,bh+4,4);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.12)';ctx.lineWidth=1;rr(ctx,bx-bw/2-2,by-2,bw+4,bh+4,4);ctx.stroke();
  const f=baseHP/10,fh=bh*f;
  if(fh>1){
    const col=baseHP>6?'#6fe08a':baseHP>3?'#ffd54a':'#ff5d6c';
    const g=ctx.createLinearGradient(0,by+bh,0,by+bh-fh);
    g.addColorStop(0,col);g.addColorStop(1,'rgba(255,255,255,.55)');
    ctx.fillStyle=g;
    ctx.beginPath();ctx.moveTo(bx-bw/2+1,by+bh-1);ctx.lineTo(bx-bw/2+1,by+bh-fh+2);ctx.arcTo(bx-bw/2+1,by+bh-fh,bx+bw/2-1,by+bh-fh,(bw-2)/2);ctx.lineTo(bx+bw/2-1,by+bh-1);ctx.closePath();ctx.fill();
  }
  ctx.strokeStyle='rgba(0,0,0,.45)';ctx.lineWidth=1;
  for(let i=1;i<10;i++){const yy=by+bh*i/10;ctx.beginPath();ctx.moveTo(bx-bw/2,yy);ctx.lineTo(bx+bw/2,yy);ctx.stroke();}
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle='#7d8db0';ctx.font="700 9px 'Segoe UI',system-ui,sans-serif";ctx.letterSpacing='1px';
  ctx.fillText('BASE',bx,by-12);ctx.letterSpacing='0px';
  if(baseHP<=3){ctx.globalAlpha=.4+.4*Math.sin(tNow*7);ctx.strokeStyle='#ff5d6c';ctx.lineWidth=2;rr(ctx,bx-bw/2-3,by-3,bw+6,bh+6,5);ctx.stroke();ctx.globalAlpha=1;}
  ctx.restore();
}
function drawPlayer(){
  const w=P.r*2;
  ctx.save();
  ctx.globalAlpha=.32;ctx.fillStyle='#000';
  ctx.beginPath();ctx.ellipse(P.x,P.y+P.r*.85,P.r*.85,P.r*.3,0,0,7);ctx.fill();
  ctx.globalAlpha=1;
  ctx.drawImage(P.img,P.x-w/2,P.y-w/2,w,w);
  ctx.restore();
}
function drawHUD(){
  ctx.textAlign='left';ctx.textBaseline='middle';
  ctx.save();ctx.translate(28,28);ctx.rotate(-.25);
  ctx.fillStyle='#ffd54a';ctx.shadowColor='rgba(255,200,70,.8)';ctx.shadowBlur=10;
  star(ctx,0,0,11,-Math.PI/2,.45);ctx.fill();
  ctx.restore();
  ctx.fillStyle='#eaf2ff';ctx.font="800 18px 'Segoe UI',system-ui,sans-serif";
  ctx.fillText(starsCaught+'/'+target,48,28);
  ctx.fillStyle='#7d8db0';ctx.font="600 10px 'Segoe UI',system-ui,sans-serif";
  ctx.fillText('STARS',48,44);
  ctx.textAlign='center';
  ctx.fillStyle='#7d8db0';ctx.font="700 12px 'Segoe UI',system-ui,sans-serif";ctx.letterSpacing='3px';
  ctx.fillText('SCORE',W/2,22);ctx.letterSpacing='0px';
  const ss=1+.25*(scorePop/.25);
  ctx.save();ctx.translate(W/2,48);ctx.scale(ss,ss);
  ctx.fillStyle='#eaf2ff';ctx.font="800 32px 'Segoe UI',system-ui,sans-serif";
  ctx.fillText(String(score),0,0);
  ctx.restore();
  if(combo>1){const ca=.7+.3*Math.sin(tNow*8);ctx.globalAlpha=ca;ctx.fillStyle='#ffd54a';ctx.font="800 15px 'Segoe UI',system-ui,sans-serif";ctx.fillText('COMBO x'+combo,W/2,76);ctx.globalAlpha=1;}
  ctx.textAlign='right';
  ctx.fillStyle='#7d8db0';ctx.font="700 12px 'Segoe UI',system-ui,sans-serif";ctx.letterSpacing='2px';
  ctx.fillText('BEST',W-40,22);ctx.letterSpacing='0px';
  ctx.fillStyle='#eaf2ff';ctx.font="800 22px 'Segoe UI',system-ui,sans-serif";
  ctx.fillText(String(best),W-40,48);
  ctx.textAlign='left';ctx.fillStyle='rgba(150,165,200,.55)';ctx.font="500 11px 'Segoe UI',system-ui,sans-serif";
  ctx.fillText('P pause   M sound '+(muted?'off':'on'),14,H-12);
}
function drawPlay(){
  drawSky();
  for(const s of stars)drawStarObj(s);
  for(const p of projs)drawProj(p);
  drawPlayer();
  drawFx();
  drawBase();
  drawBaseBar();
  drawHUD();
  if(flashT>0){ctx.fillStyle='rgba(255,60,60,'+(flashT*.45)+')';ctx.fillRect(0,0,W,H);}
  if(paused){ctx.fillStyle='rgba(3,5,12,.6)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#eaf2ff';ctx.font="800 44px 'Segoe UI',system-ui,sans-serif";ctx.fillText('PAUSED',W/2,H*.45);ctx.fillStyle='#7d8db0';ctx.font="500 15px 'Segoe UI',system-ui,sans-serif";ctx.fillText('Press P to resume',W/2,H*.45+40);}
}
function drawEnd(clear){
  drawSky();
  for(const s of stars)drawStarObj(s);
  for(const p of projs)drawProj(p);
  drawPlayer();
  drawFx();
  drawBase();
  drawBaseBar();
  ctx.fillStyle='rgba(3,5,12,.6)';ctx.fillRect(0,0,W,H);
  const k=Math.min(1,(tNow-overAt)*2.6);
  const sc=.8+.2*(1-Math.pow(1-k,3));
  ctx.save();ctx.translate(W/2,H*.3);ctx.scale(sc,sc);
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle=clear?'#7dd87d':'#eaf2ff';ctx.font="800 48px 'Segoe UI',system-ui,sans-serif";ctx.letterSpacing='5px';
  ctx.fillText(clear?'PLANET CLEARED':'GAME OVER',0,0);ctx.letterSpacing='0px';
  ctx.restore();
  ctx.textAlign='center';ctx.textBaseline='middle';
  const pl=PLANETS[planetIdx],df=DIFFS[diffIdx];
  ctx.fillStyle=df.accent;ctx.font="700 15px 'Segoe UI',system-ui,sans-serif";ctx.letterSpacing='2px';
  ctx.fillText(df.name+'  -  '+pl.name,W/2,H*.38);ctx.letterSpacing='0px';
  ctx.fillStyle='#7d8db0';ctx.font="700 13px 'Segoe UI',system-ui,sans-serif";ctx.letterSpacing='3px';
  ctx.fillText('SCORE',W/2,H*.44);ctx.letterSpacing='0px';
  ctx.fillStyle='#eaf2ff';ctx.font="800 38px 'Segoe UI',system-ui,sans-serif";
  ctx.fillText(String(score),W/2,H*.495);
  ctx.fillStyle='#8fa3c8';ctx.font="600 15px 'Segoe UI',system-ui,sans-serif";
  ctx.fillText('STARS '+starsCaught+'/'+target+'    BEST '+best,W/2,H*.545);
  if(newBest){const ca=.65+.35*Math.sin(tNow*6);ctx.globalAlpha=ca;ctx.fillStyle='#ffd54a';ctx.font="800 15px 'Segoe UI',system-ui,sans-serif";ctx.fillText('NEW BEST!',W/2,H*.545+24);ctx.globalAlpha=1;}
  for(const b of btns)drawBtn(b,b.label,true);
}

/* ================= main ================= */
function update(dt){
  updateSky(dt);
  if(mode==='menu'){
    for(let i=0;i<3;i++){const h=dist(mx,my,m.cxs[i],m.cy)<m.R*1.6?1:0;hoverAmt[i]+=(h-hoverAmt[i])*Math.min(1,dt*10);}
    for(let i=0;i<9;i++)hoverAmt[i]+=(0-hoverAmt[i])*Math.min(1,dt*10);
  }else if(mode==='diff'){
    for(let i=0;i<3;i++)hoverAmt[i]+=(0-hoverAmt[i])*Math.min(1,dt*10);
    diffHov=-1;
    for(let c=0;c<3;c++){
      const card=diffCards[c];
      if(mx>=card.x&&mx<=card.x+card.w&&my>=card.y&&my<=card.y+card.h)diffHov=c;
      for(let i=0;i<3;i++){
        const o=orbRect(card,i);
        const unlocked=i<=Math.min(3,progress[DIFFS[c].id]);
        const h=(unlocked&&dist(mx,my,o.x,o.y)<o.r*1.5)?1:0;
        hoverAmt[c*3+i]+=(h-hoverAmt[c*3+i])*Math.min(1,dt*10);
      }
    }
  }else{
    for(let i=0;i<9;i++)hoverAmt[i]+=(0-hoverAmt[i])*Math.min(1,dt*10);
  }
  if(mode==='play'&&!paused)updatePlay(dt);
  else if(mode==='over'||mode==='clear')updateEnd(dt);
  updateFx(dt);
}
function draw(){
  if(mode==='menu')drawMenu();
  else if(mode==='diff')drawDiff();
  else if(mode==='play')drawPlay();
  else if(mode==='clear')drawEnd(true);
  else drawEnd(false);
}
function frame(ts){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(ts-last)/1000);
  last=ts;tNow+=dt;
  if(!paused||mode!=='play')update(dt);
  draw();
}
let last=performance.now();

/* ================= input ================= */
function clickAt(x,y){
  ac();
  if(mode==='menu'){
    for(let i=0;i<3;i++){if(dist(x,y,m.cxs[i],m.cy)<m.R*1.35){selectHero(i);return;}}
    if(hitBtn(m.btn,x,y)){
      if(sel>=0)showDiff();
      else{float(m.btn.x+m.btn.w/2,m.btn.y-24,'CHOOSE A HERO FIRST','#ff5d6c',1.2,14);tone(170,.14,'square',.08);}
    }
  }else if(mode==='diff'){
    if(hitBtn(backBtn,x,y)){toMenu();tone(320,.08,'sine',.1);return;}
    for(let c=0;c<3;c++){
      const card=diffCards[c];
      for(let i=0;i<3;i++){
        const o=orbRect(card,i);
        if(dist(x,y,o.x,o.y)<o.r*1.35){
          if(i<=Math.min(3,progress[DIFFS[c].id])){tone(520,.09,'sine',.15);startLevel(c,i);}
          else{tone(170,.14,'square',.08);float(o.x,o.y-20,'LOCKED','#8fa3c8',1.1,12);}
          return;
        }
      }
    }
  }else if(mode==='over'||mode==='clear'){
    for(const b of btns){if(hitBtn(b,x,y)){b.cb();return;}}
  }
}
cv.addEventListener('mousemove',e=>{
  mx=e.clientX;my=e.clientY;
  let ptr=false;
  if(mode==='menu'){
    for(let i=0;i<3;i++)if(dist(mx,my,m.cxs[i],m.cy)<m.R*1.6)ptr=true;
    if(sel>=0&&hitBtn(m.btn,mx,my))ptr=true;
  }else if(mode==='diff'){
    if(hitBtn(backBtn,mx,my))ptr=true;
    for(let c=0;c<3;c++)for(let i=0;i<3;i++){const o=orbRect(diffCards[c],i);if(i<=Math.min(3,progress[DIFFS[c].id])&&dist(mx,my,o.x,o.y)<o.r*1.5)ptr=true;}
  }else if(mode==='over'||mode==='clear'){ptr=btns.some(b=>hitBtn(b,mx,my));}
  cv.style.cursor=ptr?'pointer':'default';
});
cv.addEventListener('mousedown',e=>clickAt(e.clientX,e.clientY));
cv.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0];mx=t.clientX;my=t.clientY;clickAt(t.clientX,t.clientY);touch={x:t.clientX,y:t.clientY};},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();const t=e.touches[0];touch={x:t.clientX,y:t.clientY};},{passive:false});
cv.addEventListener('touchend',e=>{e.preventDefault();touch=null;},{passive:false});
addEventListener('keydown',e=>{
  ac();
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault();
  if(mode==='play'&&(e.key==='p'||e.key==='P'||e.key==='Escape')){paused=!paused;tone(320,.08,'sine',.1);return;}
  if(mode==='play'&&(e.key==='m'||e.key==='M')){muted=!muted;return;}
  if(mode==='menu'){
    if(e.key==='1')selectHero(0);
    else if(e.key==='2')selectHero(1);
    else if(e.key==='3')selectHero(2);
    else if((e.key==='Enter'||e.key===' ')&&sel>=0)showDiff();
  }else if(mode==='diff'){
    if(e.key==='Escape'){toMenu();return;}
    if(e.key==='1')diffHov=0;
    else if(e.key==='2')diffHov=1;
    else if(e.key==='3')diffHov=2;
    else if((e.key==='Enter'||e.key===' ')&&diffHov>=0)startLevel(diffHov,0);
  }
  keys[e.key]=true;keys[e.key.toLowerCase()]=true;
});
addEventListener('keyup',e=>{keys[e.key]=false;keys[e.key.toLowerCase()]=false;});
addEventListener('resize',resize);

/* ================= boot ================= */
resize();initSky();layout();
window.SC={
  getState:()=>({mode,sel,diff:diffIdx,planet:planetIdx,score,lives:baseHP,baseHP,starsCaught,target,combo,best,stars:stars.length,projs:projs.length,px:Math.round(P.x),py:Math.round(P.y),r:P.r,paused,progress}),
  select:i=>selectHero(i),
  diff:()=>showDiff(),
  start:(d,p)=>startLevel(d===undefined?diffIdx:d,p===undefined?planetIdx:p),
  menu:()=>toMenu(),
  setBaseHP:n=>{baseHP=n;},
  setTarget:n=>{target=n;},
  spawnStarAt:(x,y,type)=>{stars.push({x,y,r:16,vy:200,vx:0,rot:0,vr:1,type:type||'n'});},
  rockFire:()=>{projs.push({x:P.x,y:P.y-P.r-8,vx:0,vy:-215,r:P.r*.25,life:1.6,rot:0,vr:7});},
  best:()=>best
};
requestAnimationFrame(frame);
</script>
</body>
