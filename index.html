'use strict';
/* ================= setup ================= */
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=innerWidth,H=innerHeight,DPR=Math.min(devicePixelRatio||1,2);
let tNow=0,mode='menu',paused=false;
let mx=-999,my=-999;
function resize(){
  W=innerWidth;H=innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  cv.style.width=W+'px';cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  layout();layoutDiff();layoutEnd();if(mode==='upgrade')layoutUpgrade();
}
function dist(x1,y1,x2,y2){return Math.hypot(x1-x2,y1-y2);}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function star(g,x,y,r,rot,inner){g.beginPath();for(let i=0;i<10;i++){const a=rot+i*Math.PI/5,rad=i%2?r*(inner||.45):r;const px=x+Math.cos(a)*rad,py=y+Math.sin(a)*rad;i?g.lineTo(px,py):g.moveTo(px,py);}g.closePath();}
function heart(g,x,y,s){g.beginPath();g.moveTo(x,y+s*.9);g.bezierCurveTo(x-s*1.1,y-s*.1,x-s*.7,y-s*1.05,x,y-s*.4);g.bezierCurveTo(x+s*.7,y-s*1.05,x+s*1.1,y-s*.1,x,y+s*.9);g.closePath();}
function shade(hex,f){const n=parseInt(hex.slice(1),16),r=Math.max(0,Math.min(255,(n>>16)&255)*f),g2=Math.max(0,Math.min(255,(n>>8)&255)*f),b=Math.max(0,Math.min(255,n&255)*f);return 'rgb('+Math.round(r)+','+Math.round(g2)+','+Math.round(b)+')';}
function hexRGB(hex){const n=parseInt(hex.slice(1),16);return [(n>>16)&255,(n>>8)&255,n&255];}

/* ================= heroes ================= */
const HEROES=[
  {id:'tank',name:'Tank',accent:'#8fc0ff',glow:[110,160,255],desc:'Huge reach, crushes stars',speed:250,radius:46,stats:[.3,1,.95],dragFac:.38},
  {id:'bolt',name:'Bolt',accent:'#ffd54a',glow:[255,200,60],desc:'Blistering speed, side lightning',speed:450,radius:26,stats:[1,.4,.35],dragFac:1.1},
  {id:'rock',name:'Rock',accent:'#e0b97c',glow:[220,170,90],desc:'Fires cone rock volleys',speed:335,radius:32,stats:[.6,.6,.75],dragFac:.85}
];
const R0=72;
let sel=-1;
const hoverAmt=[0,0,0,0,0,0,0,0,0];
function canvasOf(fn,R){const s=Math.ceil(R*2+20),c=document.createElement('canvas');c.width=c.height=s;const g=c.getContext('2d');g.translate(s/2,s/2);fn(g,R);return c;}
function drawTank(g,R){
  const grd=g.createRadialGradient(-R*.35,-R*.4,R*.1,0,0,R);
  grd.addColorStop(0,'#9db8d9');grd.addColorStop(.55,'#4a6a96');grd.addColorStop(1,'#243a5c');
  g.beginPath();g.arc(0,0,R,0,7);g.fillStyle=grd;g.fill();
  g.lineWidth=R*.08;g.strokeStyle='#18283f';g.stroke();
  g.beginPath();g.arc(0,0,R*.8,0,7);g.lineWidth=R*.045;g.strokeStyle='rgba(255,255,255,.16)';g.stroke();
  for(let i=0;i<8;i++){const a=i/8*6.283;g.beginPath();g.arc(Math.cos(a)*R*.8,Math.sin(a)*R*.8,R*.05,0,7);g.fillStyle='#16263e';g.fill();}
  rr(g,-R*.56,-R*.15,R*1.12,R*.3,R*.15);g.fillStyle='#0d1626';g.fill();
  g.fillStyle='#8fe3ff';g.beginPath();g.arc(-R*.24,0,R*.07,0,7);g.fill();g.beginPath();g.arc(R*.24,0,R*.07,0,7);g.fill();
  g.strokeStyle='#0d1626';g.lineWidth=R*.05;g.beginPath();g.moveTo(-R*.22,R*.3);g.lineTo(R*.22,R*.3);g.stroke();
}
function drawBolt(g,R){
  const grd=g.createRadialGradient(-R*.3,-R*.35,R*.1,0,0,R);
  grd.addColorStop(0,'#fff6c8');grd.addColorStop(.5,'#ffce3d');grd.addColorStop(1,'#e08a00');
  g.beginPath();g.arc(0,0,R,0,7);g.fillStyle=grd;g.fill();
  g.lineWidth=R*.08;g.strokeStyle='#8a5a00';g.stroke();
  g.save();g.shadowColor='rgba(255,220,90,.9)';g.shadowBlur=R*.35;
  g.fillStyle='#fff9dc';g.strokeStyle='#8a5a00';g.lineWidth=R*.05;
  g.beginPath();
  const b=R*.52;
  g.moveTo(-b*.15,-b);g.lineTo(-b*.55,b*.05);g.lineTo(-b*.05,b*.05);g.lineTo(-b*.45,b);g.lineTo(b*.6,-b*.3);g.lineTo(b*.08,-b*.3);g.lineTo(b*.3,-b);g.closePath();
  g.fill();g.stroke();
  g.restore();
  g.strokeStyle='#fff';g.lineWidth=R*.045;
  for(const s of [[-R*.72,-R*.6],[R*.74,-R*.55]]){
    g.beginPath();g.moveTo(s[0]-R*.08,s[1]);g.lineTo(s[0]+R*.08,s[1]);g.stroke();
    g.beginPath();g.moveTo(s[0],s[1]-R*.08);g.lineTo(s[0],s[1]+R*.08);g.stroke();
  }
}
function drawRock(g,R){
  const grd=g.createRadialGradient(-R*.3,-R*.35,R*.1,0,0,R);
  grd.addColorStop(0,'#d8b88a');grd.addColorStop(.5,'#a98760');grd.addColorStop(1,'#6b5136');
  const pts=16,rads=[];
  for(let i=0;i<pts;i++)rads.push(R*(0.9+0.12*Math.sin(i*2.7+1.3)+0.06*Math.cos(i*1.3)));
  g.beginPath();
  for(let i=0;i<=pts;i++){const a=i/pts*6.283,r2=rads[i%pts],px=Math.cos(a)*r2,py=Math.sin(a)*r2;i?g.lineTo(px,py):g.moveTo(px,py);}
  g.closePath();g.fillStyle=grd;g.fill();
  g.lineWidth=R*.07;g.strokeStyle='#4c3a24';g.stroke();
  g.strokeStyle='rgba(60,42,20,.85)';g.lineWidth=R*.04;
  g.beginPath();g.moveTo(-R*.5,-R*.15);g.lineTo(-R*.15,R*.05);g.lineTo(-R*.3,R*.4);g.stroke();
  g.beginPath();g.moveTo(R*.45,-R*.35);g.lineTo(R*.15,-R*.05);g.lineTo(R*.5,R*.1);g.stroke();
  g.fillStyle='#ffb84d';g.beginPath();g.arc(-R*.28,-R*.12,R*.09,0,7);g.fill();g.beginPath();g.arc(R*.28,-R*.12,R*.09,0,7);g.fill();
  g.fillStyle='#3a2a14';g.beginPath();g.arc(-R*.25,-R*.12,R*.05,0,7);g.fill();g.beginPath();g.arc(R*.31,-R*.12,R*.05,0,7);g.fill();
  g.strokeStyle='#3a2a14';g.lineWidth=R*.045;g.beginPath();g.moveTo(-R*.2,R*.22);g.lineTo(R*.2,R*.22);g.stroke();
  g.fillStyle='rgba(96,140,70,.55)';g.beginPath();g.arc(R*.5,R*.55,R*.28,0,7);g.fill();
}
const heroImg=[canvasOf(drawRock,R0),canvasOf(drawBolt,R0),canvasOf(drawTank,R0)];

/* planet orb canvases */
function planetCanvas(col){
  const r=30,s=r*2+18,c=document.createElement('canvas');c.width=c.height=s;
  const g=c.getContext('2d');g.translate(s/2,s/2);
  const grd=g.createRadialGradient(-r*.35,-r*.4,r*.1,0,0,r);
  grd.addColorStop(0,'#ffffff');grd.addColorStop(.28,shade(col,1.25));grd.addColorStop(.6,col);grd.addColorStop(1,shade(col,.45));
  g.beginPath();g.arc(0,0,r,0,7);g.fillStyle=grd;g.fill();
  g.lineWidth=2;g.strokeStyle='rgba(255,255,255,.35)';g.stroke();
  for(let i=0;i<5;i++){const a=Math.random()*6.283,d=r*(.3+Math.random()*.5);g.beginPath();g.arc(Math.cos(a)*d,Math.sin(a)*d,2+Math.random()*3.5,0,7);g.fillStyle='rgba(0,0,0,.22)';g.fill();}
  g.save();g.globalAlpha=.5;g.strokeStyle='rgba(255,255,255,.55)';g.lineWidth=3.5;
  g.beginPath();g.ellipse(0,0,r*1.28,r*.42,-.35,0,7);g.stroke();g.restore();
  g.fillStyle='rgba(255,255,255,.4)';g.beginPath();g.ellipse(-r*.35,-r*.4,r*.4,r*.22,-.6,0,7);g.fill();
  return c;
}
const planetImg=PLANETS.map(p=>planetCanvas(p.col));
function drawLock(g,x,y,s){

/* ================= layout ================= */
let m={R:66,gap:230,cy:0,cxs:[0,0,0],btn:{x:0,y:0,w:260,h:64},hintY:0};
let diffCards=[],backBtn={x:14,y:14,w:104,h:40},diffHov=-1;
let endlessCard={x:0,y:0,w:0,h:0},endlessHov=0;
let inf=null,upgChoices=[],upgCards=[],upgHov=-1;
let btns=[];
function layout(){
  m.R=Math.max(40,Math.min(78,W/6.4,H*.105));
  m.gap=m.R*3.4;
  m.cy=H*.47;
  for(let i=0;i<3;i++)m.cxs[i]=W/2+(i-1)*m.gap;
  const bw=Math.min(280,W*.8),bh=64;
  m.btn={x:W/2-bw/2,y:H-150,w:bw,h:bh};
  m.hintY=H-76;
}
function layoutDiff(){
  backBtn={x:14,y:14,w:104,h:40};
  diffCards=[];
  const wide=W>=740;
  if(wide){
    const cw=Math.min(216,(W-90)/3),ch=Math.min(292,H-250),gap=14;
    const x0=Math.max(8,(W-(cw*3+gap*2))/2),y0=Math.max(148,H*.30);
    for(let i=0;i<3;i++)diffCards.push({x:x0+i*(cw+gap),y:y0,w:cw,h:ch});
    endlessCard={x:x0,y:y0+ch+gap,w:cw*3+gap*2,h:52};
  }else{
    const cw=Math.min(W-48,230),ch=Math.min(126,(H-250)/4),gap=10;
    const x0=(W-cw)/2,y0=142;
    for(let i=0;i<3;i++)diffCards.push({x:x0,y:y0+i*(ch+gap),w:cw,h:ch});
    endlessCard={x:x0,y:y0+3*(ch+gap),w:cw,h:52};
  }
}
function layoutEnd(){
  if((mode!=='over'&&mode!=='clear')||btns.length<2)return;
  const cw=250,ch=54,gap=12,n=btns.length;
  const total=n*ch+(n-1)*gap,y0=H*.56;
  for(let i=0;i<n;i++){btns[i].x=W/2-cw/2;btns[i].y=y0+i*(ch+gap);btns[i].w=cw;btns[i].h=ch;}
}
function hitBtn(b,x,y){return x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h;}

/* ================= sky ================= */
const bgStars=[],specks=[],shooters=[];
let shooterT=2;
function initSky(){
  bgStars.length=0;specks.length=0;shooters.length=0;
  for(let i=0;i<140;i++)bgStars.push({x:Math.random()*W,y:Math.random()*H,r:.5+Math.random()*1.4,ph:Math.random()*6.283,sp:.5+Math.random()*2,tw:.4+Math.random()*1.6});
  for(let i=0;i<46;i++)specks.push({x:Math.random()*W,y:Math.random()*H,r:.4+Math.random()*1.1,vy:22+Math.random()*60,a:.15+Math.random()*.35,ph:Math.random()*6.283});
}
function updateSky(dt){
  for(const s of specks){s.y+=s.vy*dt;if(s.y>H+4){s.y=-4;s.x=Math.random()*W;}}
  shooterT-=dt;
  if(shooterT<=0){shooterT=2.2+Math.random()*3.2;shooters.push({x:W*.2+Math.random()*W*.7,y:Math.random()*H*.3,vx:-(180+Math.random()*160),vy:90+Math.random()*70,life:1.6});}
  for(let i=shooters.length-1;i>=0;i--){const s=shooters[i];s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;if(s.life<=0||s.x<-80||s.y>H+60)shooters.splice(i,1);}
}
function skyTint(){
  if(mode==='play'||mode==='clear'||mode==='over'||mode==='upgrade')return PLANETS[planetIdx].sky;
  return null;
}
function drawSky(){
  const tint=skyTint();
  const mid=tint?'rgb('+Math.round(tint[0]*.3)+','+Math.round(tint[1]*.3)+','+Math.round(tint[2]*.3)+')':'#0a0d24';
  const bot=tint?'rgb('+Math.round(tint[0]*.55)+','+Math.round(tint[1]*.55)+','+Math.round(tint[2]*.55)+')':'#10143a';
  const grd=ctx.createLinearGradient(0,0,0,H);
  grd.addColorStop(0,'#05070f');grd.addColorStop(.55,mid);grd.addColorStop(1,bot);
  ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);
  for(let i=0;i<3;i++){const nx=(.15+i*.33)*W,ny=(.18+i*.26)*H;const ng=ctx.createRadialGradient(nx,ny,10,nx,ny,260+i*80);ng.addColorStop(0,tint?'rgba('+tint[0]+','+tint[1]+','+tint[2]+',.13)':'rgba(70,90,190,.06)');ng.addColorStop(1,'rgba(70,90,190,0)');ctx.fillStyle=ng;ctx.fillRect(nx-330,ny-330,660,660);}
  for(const s of bgStars){const a=.3+.7*(.5+.5*Math.sin(tNow*s.sp+s.ph))*s.tw*.5;ctx.globalAlpha=Math.min(1,a);ctx.fillStyle='#cfe0ff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill();}
  ctx.globalAlpha=1;
  for(const s of specks){const a=s.a*(.5+.5*Math.sin(tNow*2+s.ph));ctx.globalAlpha=a;ctx.fillStyle='#bfd0ff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill();}
  ctx.globalAlpha=1;
  for(const s of shooters){
    const a=Math.min(1,s.life);
    const g=ctx.createLinearGradient(s.x,s.y,s.x-s.vx*.16,s.y-s.vy*.16);
    g.addColorStop(0,'rgba(220,235,255,0)');g.addColorStop(1,'rgba(255,255,255,'+(.9*a)+')');
    ctx.strokeStyle=g;ctx.lineWidth=2;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(s.x-s.vx*.16,s.y-s.vy*.16);ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,'+a+')';ctx.beginPath();ctx.arc(s.x,s.y,2.2,0,7);ctx.fill();
  }
}

/* ================= audio ================= */
let AC=null,muted=false;
function ac(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();ensureMusic();return AC;}
function tone(f,d,type,v,slide){if(muted)return;const c=ac(),o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,c.currentTime);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),c.currentTime+d);g.gain.setValueAtTime(v||.14,c.currentTime);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+d);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d+.02);}

/* ================= sample sfx ================= */
let SFX={};
function loadSFX(){
  const c=ac();
  if(!c)return;
  const load=(name,url)=>{fetch(url).then(r=>r.arrayBuffer()).then(b=>c.decodeAudioData(b).then(buf=>{SFX[name]=buf;})).catch(()=>{});};
  load('warp1','audio/star-warp.mp3');
  load('warp2','audio/bolt-warp.mp3');
  load('music','audio/music.mp3');
}
function snd(name,rate,vol,delay){
  if(muted)return;
  const buf=SFX[name];
  if(!buf)return;
  const c=ac(),src=c.createBufferSource(),g=c.createGain();
  src.buffer=buf;
  src.playbackRate.value=rate||1;
  const t0=c.currentTime+(delay||0);
  g.gain.setValueAtTime(vol||.5,t0);
  g.gain.exponentialRampToValueAtTime(.0001,t0+Math.max(.1,buf.duration/Math.max(.1,rate||1)));
  src.connect(g);g.connect(c.destination);
  src.start(t0);
}

/* ================= music ================= */
let musicOn=true,musicVol=.55,musicStarted=false,musicGain=null,musicSrc=null;
function ensureMusic(){
  if(!musicOn||musicStarted||!SFX.music||!AC)return;
  musicStarted=true;
  const c=AC;
  if(c.state==='suspended')c.resume();
  const src=c.createBufferSource();
  src.buffer=SFX.music;
  const dur=SFX.music.duration;
  const loopFrom=dur>10.5?10:0;
  src.loop=true;
  src.loopStart=Math.min(loopFrom,Math.max(0,dur-1));
  src.loopEnd=dur;
  musicGain=c.createGain();
  musicGain.gain.value=muted?0:musicVol;
  src.connect(musicGain);musicGain.connect(c.destination);
  src.start(0,Math.min(loopFrom,Math.max(0,dur-.5)));
  musicSrc=src;
}
function toggleMusic(){
  if(!AC)return;
  if(musicOn){
    if(!musicStarted)ensureMusic();
    else if(musicGain)musicGain.gain.setTargetAtTime(muted?0:musicVol,AC.currentTime,.05);
  }else{
    if(musicGain)musicGain.gain.setTargetAtTime(0,AC.currentTime,.08);
  }
}

/* ================= settings bar ================= */
let settingsOpen=false,settingsDrag=null;
const SET_R=16;
function setGearRect(){return{x:W-30,y:80,r:SET_R};}
function setPanelRect(){return{x:Math.max(8,W-242),y:104,w:212,h:148};}
function setToggleRect(){const p=setPanelRect();return{x:p.x+p.w-56,y:p.y+44,w:44,h:22};}
function setSliderRect(){const p=setPanelRect();return{x:p.x+p.w-126,y:p.y+84,w:112,h:22};}
function setVolFromX(x){
  const s=setSliderRect();
  musicVol=Math.round(Math.max(0,Math.min(1,(x-s.x)/s.w))*100)/100;
  if(musicGain)musicGain.gain.setTargetAtTime((muted||!musicOn)?0:musicVol,ac().currentTime,.05);
  try{localStorage.setItem('starcatcher_music_vol',String(musicVol));}catch(e){}
  snd('warp2',1.2,.15);
}
function handleSettingsClick(x,y){
  const g=setGearRect();
  const onGear=dist(x,y,g.x,g.y)<g.r+6;
  if(!settingsOpen){
    if(onGear){settingsOpen=true;snd('warp2',1.1,.2);return true;}

/* ================= fx ================= */
let parts=[],floats=[],crushes=[],shocks=[],shakeT=0;
function burst(x,y,color,n){
  for(let i=0;i<n;i++){
    const a=Math.random()*6.283,sp=60+Math.random()*220;
    parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:1.5+Math.random()*2.6,life:.4+Math.random()*.5,max:0,color,type:Math.random()<.25?'star':'dot',rot:Math.random()*6.283,vr:(Math.random()-.5)*8});
  }
}
function float(x,y,text,color,life,size){floats.push({x,y,text,color,life:life||1.2,max:life||1.2,size:size||16});}
function crush(x,y,rad){
  crushes.push({x,y,t:0,max:.22,rad});
  for(let i=0;i<14;i++){
    const a=Math.random()*6.283,sp=80+Math.random()*260;
    parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:2+Math.random()*3,life:.3+Math.random()*.35,max:0,color:Math.random()<.5?'#eef3fa':'#9fb0c8',type:'shard',rot:Math.random()*6.283,vr:(Math.random()-.5)*14});
  }
  snd('warp1',.4,.6);
}
function updateFx(dt){
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.max=p.max||p.life;p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=260*dt;p.rot+=p.vr*dt;if(p.life<=0)parts.splice(i,1);}
  for(let i=floats.length-1;i>=0;i--){const f=floats[i];f.life-=dt;f.y-=32*dt;if(f.life<=0)floats.splice(i,1);}
  for(let i=shocks.length-1;i>=0;i--){const sh=shocks[i];sh.t+=dt;if(sh.t>=sh.max)shocks.splice(i,1);}
  if(shakeT>0)shakeT-=dt;
}
function drawFx(){
  for(const p of parts){const a=Math.max(0,p.life/p.max);ctx.globalAlpha=a;ctx.fillStyle=p.color;if(p.type==='star'){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);star(ctx,0,0,p.r*2.2,0,.45);ctx.fill();ctx.restore();}else if(p.type==='shard'){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.beginPath();ctx.moveTo(p.r*1.4,0);ctx.lineTo(-p.r*.8,p.r*.9);ctx.lineTo(-p.r*.8,-p.r*.9);ctx.closePath();ctx.fill();ctx.restore();}else{ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();}}
  ctx.globalAlpha=1;
  for(const f of floats){ctx.globalAlpha=Math.min(1,f.life);ctx.fillStyle=f.color;ctx.font="800 "+f.size+"px 'Segoe UI',system-ui,sans-serif";ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(f.text,f.x,f.y);}
  for(const sh of shocks){
    const k=Math.min(1,sh.t/sh.max);
    const rr2=sh.rad*(.3+.7*(1-Math.pow(1-k,2)));
    ctx.globalAlpha=(1-k)*.8;
    ctx.strokeStyle=sh.col;ctx.lineWidth=4*(1-k)+1;
    ctx.beginPath();ctx.arc(sh.x,sh.y,rr2,0,7);ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=2*(1-k);
    ctx.beginPath();ctx.arc(sh.x,sh.y,rr2*.7,0,7);ctx.stroke();
  }
  ctx.globalAlpha=1;
}

/* ================= splash ================= */
function halftoneBand(g,x,y,w,color,row,phase){
  g.save();g.fillStyle=color;
  for(let i=0;i<=Math.ceil(w/13);i++){
    const xx=x+i*13;
    const v=Math.abs(Math.sin(xx*.028+phase+row*1.7));
    g.globalAlpha=.12+.55*v;
    g.beginPath();g.arc(xx,y+Math.sin(xx*.04+phase)*7,1.5+v*4.2,0,7);g.fill();
  }
  g.restore();
}
function halftoneRing(g,cx,cy,r,color,n,phase){
  g.save();g.fillStyle=color;
  for(let i=0;i<n;i++){
    const a=i/n*6.283+phase;
    const v=Math.abs(Math.sin(a*4+phase*2));
    g.globalAlpha=.25+.7*v;
    const rad=r-v*6;
    g.beginPath();g.arc(cx+Math.cos(a)*rad,cy+Math.sin(a)*rad,1.2+v*3.4,0,7);g.fill();
  }
  g.restore();
}
function drawSplash(){
  const p=Math.min(1,(1.9-splashT)/1.9);
  const k=Math.min(1,p*2.1);
  const ease=k<1?1-Math.pow(1-k,3):1;
  drawSky();
  ctx.fillStyle='rgba(3,5,14,.55)';ctx.fillRect(0,0,W,H);
  const cw=Math.min(W*.9,660),ch=Math.min(H*.8,480);
  const cx=W/2,cy=H/2;
  ctx.save();
  ctx.translate(cx,cy);
  ctx.scale(.9+.1*ease,.9+.1*ease);
  /* card */
  const cg=ctx.createLinearGradient(0,-ch/2,0,ch/2);
  cg.addColorStop(0,'rgba(22,29,54,.94)');cg.addColorStop(1,'rgba(8,11,24,.96)');
  rr(ctx,-cw/2,-ch/2,cw,ch,24);ctx.fillStyle=cg;ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.2)';ctx.lineWidth=1.5;rr(ctx,-cw/2,-ch/2,cw,ch,24);ctx.stroke();
  ctx.strokeStyle='rgba(255,213,74,.3)';ctx.lineWidth=1;rr(ctx,-cw/2+8,-ch/2+8,cw-16,ch-16,18);ctx.stroke();
  /* corner accents */
  const ca=14;
  ctx.strokeStyle='rgba(255,213,74,.85)';ctx.lineWidth=3;ctx.lineCap='round';
  const corners=[[-cw/2+10,-ch/2+10,1,1],[cw/2-10,-ch/2+10,-1,1],[-cw/2+10,ch/2-10,1,-1],[cw/2-10,ch/2-10,-1,-1]];
  for(const c of corners){ctx.beginPath();ctx.moveTo(c[0]+c[2]*ca,c[1]);ctx.lineTo(c[0],c[1]);ctx.lineTo(c[0],c[1]+c[3]*ca);ctx.stroke();}
  ctx.lineCap='butt';
  /* faint halftone backdrop rows */
  for(let row=0;row<7;row++)halftoneBand(ctx,-cw/2+12,-ch/2+78+row*52,cw-24,'rgba(120,150,220,.18)',row,p*1.6);
  /* title: staggered letters, STAR in ice blue, CATCHER in gold */
  const fs=Math.min(52,cw*.085);
  const ty=-ch*.30;
  const titleTxt='STAR CATCHER';
  ctx.font="800 "+fs+"px 'Segoe UI',system-ui,sans-serif";
  ctx.textAlign='center';ctx.textBaseline='middle';
  const widths=[];

    const ch2=titleTxt[i],cw2=widths[i],gold=ch2!==' ';
    const x=acc+cw2/2;acc+=cw2;
    if(ch2===' ')continue;
    const li=Math.max(0,Math.min(1,p*2.4-i*.055));
    const liE=li<1?1-Math.pow(1-li,3):1;
    ctx.save();

    ctx.globalAlpha=liE;
    ctx.font="800 "+fs+"px 'Segoe UI',system-ui,sans-serif";
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.shadowColor=gold?'rgba(255,213,74,.95)':'rgba(140,190,255,.9)';
    ctx.shadowBlur=18;
    ctx.fillStyle=gold?'#ffd54a':'#eaf2ff';
    ctx.fillText(ch2,0,0);
    ctx.restore();
  }
  /* pulsing emblem star above title */
  const stp=.6+.4*Math.sin(tNow*3);
  ctx.save();ctx.translate(0,ty-fs*.62);ctx.scale(stp,stp);
  ctx.shadowColor='rgba(255,200,70,1)';ctx.shadowBlur=22;
  ctx.fillStyle='#ffd54a';star(ctx,0,0,13,-Math.PI/2,.45);ctx.fill();
  ctx.restore();
  /* tagline */
  ctx.globalAlpha=Math.min(1,p*3);
  ctx.fillStyle='#8fa3c8';ctx.font="600 13px 'Segoe UI',system-ui,sans-serif";ctx.letterSpacing='4px';
  ctx.fillText('CATCH STARS  •  DODGE BOMBS  •  GO ENDLESS',0,ty+fs*.78);ctx.letterSpacing='0px';
  ctx.globalAlpha=1;
  /* hero orbs: strong glow + halftone rings in hero colors */
  const oy=ch*.14;
  const orbs=[-Math.min(96,cw*.21),0,Math.min(96,cw*.21)];
  for(let i=0;i<3;i++){
    const o=orbs[i],col=HEROES[i],rgb=col.glow;
    const oy2=oy+Math.sin(tNow*1.8+i*2.1)*4;
    const fade=Math.max(0,Math.min(1,p*2.6-i*.3));
    if(fade<=0)continue;
    ctx.globalAlpha=fade;
    const g=ctx.createRadialGradient(o,oy2-6,4,o,oy2-6,92);
    g.addColorStop(0,'rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+','+(.5+.25*Math.sin(tNow*2.6+i*2.1))+')');
    g.addColorStop(1,'rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+',0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(o,oy2-6,92,0,7);ctx.fill();
    halftoneRing(ctx,o,oy2,46,'rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+',.85)',26,tNow*1.4+i*2.1);
    ctx.fillStyle='rgba(5,8,18,.88)';ctx.beginPath();ctx.arc(o,oy2,37,0,7);ctx.fill();
    ctx.strokeStyle='rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+',.95)';ctx.lineWidth=2;ctx.stroke();
    ctx.save();
    ctx.shadowColor='rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+',1)';
    ctx.shadowBlur=30;
    drawHeroImg(heroImg[i],o,oy2,62);
    ctx.restore();
    ctx.fillStyle=col.accent;ctx.font="800 13px 'Segoe UI',system-ui,sans-serif";ctx.letterSpacing='2px';

    ctx.globalAlpha=1;
  }
  /* bottom strip: difficulty dots + credits */
  ctx.globalAlpha=.85;
  const dotCols=['#7dd87d','#ffb84d','#ff6d7d'];
  for(let i=0;i<3;i++){
    ctx.fillStyle=dotCols[i];ctx.shadowColor=dotCols[i];ctx.shadowBlur=8;
    ctx.beginPath();ctx.arc(-40+i*40,ch/2-34,3.2,0,7);ctx.fill();
  }
  ctx.shadowBlur=0;
  ctx.fillStyle='#5a6a90';ctx.font="500 9px 'Segoe UI',system-ui,sans-serif";ctx.letterSpacing='2px';
  ctx.fillText('EASY     MEDIUM     HARD',0,ch/2-18);ctx.letterSpacing='0px';
  ctx.fillStyle='#4d5b7c';ctx.font="600 9px 'Segoe UI',system-ui,sans-serif";ctx.letterSpacing='3px';
  ctx.fillText('★  HEROES ARCADE  ★',0,ch/2-6);ctx.letterSpacing='0px';
  ctx.globalAlpha=1;
  ctx.restore();
  /* fade-out flash at the very end */
  if(splashT<.24){
    const fa=Math.max(0,1-splashT/.24);

  }
}

function updatePlay(dt){
  runT+=dt;
  if(diffIdx===3){
    inf.t+=dt;
    inf.stress+=(0-inf.stress)*dt*.06;
    if(inf.grace>0)inf.grace-=dt;
    const nw=Math.floor(inf.t/30)+1;
    if(nw>inf.wave){
      inf.wave=nw;planetIdx=(planetIdx+1)%PLANETS.length;
      inf.stress=Math.min(1,inf.stress+.1);
      float(W/2,H*.3,'WAVE '+nw,'#ffd54a',1.6,30);
      float(W/2,H*.3+38,'NEW PLANET: '+PLANETS[planetIdx].name,PLANETS[planetIdx].col,1.6,18);
      snd('warp1',.9,.4);snd('warp1',1.2,.3,.1);
    }
    if(inf.upgrades.regen){
      inf.regenT-=dt;
      if(inf.regenT<=0){
        inf.regenT=8/Math.max(1,inf.upgrades.regen);
        if(baseHP<maxHP){baseHP++;float(P.x,P.y-P.r-20,'+1','#7dd87d',1,14);}
      }
    }
  }
  if(scorePop>0)scorePop-=dt;
  if(flashT>0)flashT-=dt;
  if(missT>0)missT-=dt;
  if(comboT>0){comboT-=dt;if(comboT<=0)combo=0;}
  spawnT-=dt;
  if(spawnT<=0){spawnStar();spawnT=effSpawn()*(diffIdx===3&&inf.grace>0?1.5:1);}
  let mvx=0,mvy=0;
  if(drag){
    const k=Math.min(1,dt*16)*(HEROES[sel].dragFac||1);
    P.x+=(dragX-P.x)*k;P.y+=(dragY-P.y)*k;
  }else{
    if(keys['ArrowLeft']||keys['a'])mvx-=1;
    if(keys['ArrowRight']||keys['d'])mvx+=1;
    if(keys['ArrowUp']||keys['w'])mvy-=1;
    if(keys['ArrowDown']||keys['s'])mvy+=1;
    if(mvx||mvy){const mm=Math.hypot(mvx,mvy);mvx/=mm;mvy/=mm;mvx*=P.sp;mvy*=P.sp;}
    P.x+=mvx*dt;P.y+=mvy*dt;
  }
  P.x=Math.max(P.r+8,Math.min(W-P.r-8,P.x));
  P.y=Math.max(H*.3,Math.min(H-BASE_TOP-P.r-8,P.y));
  /* rock cone volley */
  if(HEROES[sel].id==='rock'){
    fireT-=dt;
    if(fireT<=0){
      const rapid=(inf&&inf.upgrades.rapid)||0;
      fireT=1.0*Math.pow(.85,rapid);
      const pr=P.r*.25*(1+.3*((inf&&inf.upgrades.projsize)||0));
      const n=3+2*((inf&&inf.upgrades.proj)||0);
      const spread=.28+.1*((inf&&inf.upgrades.proj)||0);
      for(let k=0;k<n;k++){
        const a=-Math.PI/2+(k-(n-1)/2)*(2*spread/Math.max(1,n-1));
        projs.push({x:P.x,y:P.y-P.r-8,vx:Math.cos(a)*215,vy:Math.sin(a)*215,r:pr,life:1.6,rot:0,vr:7});
      }
      snd('warp1',.75,.4);
    }
  }
  /* bolt side lightning */
  else if(HEROES[sel].id==='bolt'){
    fireT-=dt;
    if(fireT<=0){
      const rapid=(inf&&inf.upgrades.rapid)||0;
      fireT=.9*Math.pow(.85,rapid);
      const pr=P.r*.22*(1+.3*((inf&&inf.upgrades.projsize)||0));
      const n=2+((inf&&inf.upgrades.proj)||0);
      for(let k=0;k<n;k++){
        const t=n>1?k/(n-1):0;
        const la=Math.PI-.45+.9*t,ra=-.45+.9*t;
        projs.push({x:P.x-P.r-6,y:P.y,vx:Math.cos(la)*290,vy:Math.sin(la)*290,r:pr,life:1.2,rot:0,vr:0,kind:'bolt',jag:[Math.random()*2-1,Math.random()*2-1,Math.random()*2-1,Math.random()*2-1]});
        projs.push({x:P.x+P.r+6,y:P.y,vx:Math.cos(ra)*290,vy:Math.sin(ra)*290,r:pr,life:1.2,rot:0,vr:0,kind:'bolt',jag:[Math.random()*2-1,Math.random()*2-1,Math.random()*2-1,Math.random()*2-1]});
      }
      snd('warp2',1.2,.4);snd('warp2',1.7,.3,.05);
    }
  }
  for(let i=projs.length-1;i>=0;i--){
    const p=projs[i];
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;p.life-=dt;
    if(p.life<=0||p.y<-40||p.x<-40||p.x>W+40){projs.splice(i,1);continue;}
    for(let j=stars.length-1;j>=0;j--){
      const s=stars[j];
      if(dist(p.x,p.y,s.x,s.y)<p.r+s.r*.7){stars.splice(j,1);s.type==='bomb'?defuse(s.x,s.y):onCatch(s);}
    }
  }
  if(diffIdx===3&&inf.upgrades.magnet){
    for(const s of stars){
      if(s.type==='bomb')continue;
      const d2=dist(P.x,P.y,s.x,s.y);
      if(d2<170&&d2>1){
        const k=2.6*dt*(1-d2/170);
        s.x+=(P.x-s.x)/d2*170*k;
        if(s.y<P.y)s.y+=(P.y-s.y)/d2*170*k*.55;
      }
    }
  }
  for(let i=stars.length-1;i>=0;i--){
    const s=stars[i];
    s.y+=s.vy*dt;s.x+=s.vx*dt;s.rot+=s.vr*dt;
    if(s.type==='bomb'){
      s.beepT=(s.beepT||.5)-dt;
      if(s.beepT<=0){s.beepT=Math.max(.14,.55-(H-BASE_TOP-s.y)/H*.45);tone(1150,.05,'square',.032);}
    }
    if(s.y>H-BASE_TOP+6){stars.splice(i,1);s.type==='bomb'?fizzle(s.x):onLeak(s.x);continue;}
    if(dist(P.x,P.y,s.x,s.y)<P.r+s.r*.7){
      stars.splice(i,1);
      if(s.type==='bomb'){
        if(inf&&inf.upgrades.bombproof)defuse(s.x,s.y);
        else onBombHit(s.x,s.y);
      }
      else{onCatch(s);if(HEROES[sel].id==='tank')crush(P.x,P.y,P.r*2.3*(1+.35*((inf&&inf.upgrades.proj)||0)));}
    }
  }
  /* tank crush rings expand and smash nearby stars too */
  for(let i=crushes.length-1;i>=0;i--){
    const cr=crushes[i];cr.t+=dt;
    const k=Math.min(1,cr.t/cr.max);
    const rr2=cr.rad*(.35+.65*(1-Math.pow(1-k,2)));
    for(let j=stars.length-1;j>=0;j--){
      const s=stars[j];
      if(dist(cr.x,cr.y,s.x,s.y)<rr2+s.r*.7){stars.splice(j,1);s.type==='bomb'?defuse(s.x,s.y):onCatch(s);}
    }
    if(cr.t>=cr.max)crushes.splice(i,1);
  }
}
function updateEnd(dt){

  for(let i=projs.length-1;i>=0;i--){const p=projs[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0||p.y<-40||p.x<-40||p.x>W+40)projs.splice(i,1);}
}

  if(diffIdx===3){
    ctx.textAlign='center';
    ctx.fillStyle='#a97ce8';ctx.font="700 12px 'Segoe UI',system-ui,sans-serif";ctx.letterSpacing='2px';
    ctx.fillText('LV '+inf.level,W/2,98);ctx.letterSpacing='0px';
    const bw2=120,bx2=W/2-bw2/2;
    ctx.fillStyle='rgba(255,255,255,.08)';rr(ctx,bx2,108,bw2,7,3.5);ctx.fill();
    const f=Math.min(1,inf.xp/inf.xpNeed);
    if(f>0){ctx.fillStyle='#a97ce8';rr(ctx,bx2,108,bw2*f,7,3.5);ctx.fill();}
    const st=Math.max(-1,Math.min(1,inf.stress));
    const sf=(st+1)/2;
    const acol=st<-.25?'#6fe08a':st>.35?'#ff5d6c':'#ffd54a';
    ctx.fillStyle='rgba(255,255,255,.08)';rr(ctx,bx2,124,bw2,7,3.5);ctx.fill();
    if(sf>0){ctx.fillStyle=acol;rr(ctx,bx2,124,bw2*sf,7,3.5);ctx.fill();}
    ctx.fillStyle='#7d8db0';ctx.font="600 10px 'Segoe UI',system-ui,sans-serif";ctx.letterSpacing='1px';
    ctx.fillText('ADAPT',bx2-28,127.5);ctx.letterSpacing='0px';
  }
  ctx.textAlign='right';
  ctx.fillStyle='#7d8db0';ctx.font="700 12px 'Segoe UI',system-ui,sans-serif";ctx.letterSpacing='2px';
  ctx.fillText('BEST',W-40,22);ctx.letterSpacing='0px';
  ctx.fillStyle='#eaf2ff';ctx.font="800 22px 'Segoe UI',system-ui,sans-serif";
  ctx.fillText(String(diffIdx===3?endBest:best),W-40,48);
  ctx.textAlign='left';ctx.fillStyle='rgba(150,165,200,.55)';ctx.font="500 11px 'Segoe UI',system-ui,sans-serif";
  ctx.fillText('DRAG hero - WASD - P pause - M sound '+(muted?'off':'on'),14,H-12);
}
function drawPlay(){
  drawSky();
  for(const s of stars)drawStarObj(s);
  for(const p of projs)drawProj(p);
  drawPlayer();
  drawFx();
  for(const cr of crushes){
    const k=Math.min(1,cr.t/cr.max);
    const rr2=cr.rad*(.35+.65*(1-Math.pow(1-k,2)));
    ctx.save();
    ctx.globalAlpha=(1-k)*.9;
    ctx.strokeStyle='#eef3fa';ctx.lineWidth=3*(1-k)+1;
    ctx.beginPath();ctx.arc(cr.x,cr.y,rr2,0,7);ctx.stroke();
    ctx.strokeStyle='rgba(143,176,200,.55)';ctx.lineWidth=1.5*(1-k);
    ctx.beginPath();ctx.arc(cr.x,cr.y,rr2*1.3,0,7);ctx.stroke();
    ctx.restore();
  }
  drawBase();
  drawBaseBar();
  drawHUD();
  if(flashT>0){ctx.fillStyle='rgba(255,60,60,'+(flashT*.45)+')';ctx.fillRect(0,0,W,H);}
  if(paused){ctx.fillStyle='rgba(3,5,12,.6)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#eaf2ff';ctx.font="800 44px 'Segoe UI',system-ui,sans-serif";ctx.fillText('PAUSED',W/2,H*.45);ctx.fillStyle='#7d8db0';ctx.font="500 15px 'Segoe UI',system-ui,sans-serif";ctx.fillText('Press P to resume',W/2,H*.45+40);}
}
function drawEnd(clear){
  drawSky();
  for(const s of stars)drawStarObj(s);
  for(const p of projs)drawProj(p);
  drawPlayer();
  drawFx();
  drawBase();
  drawBaseBar();
  ctx.fillStyle='rgba(3,5,12,.6)';ctx.fillRect(0,0,W,H);
  const k=Math.min(1,(tNow-overAt)*2.6);
  const sc=.8+.2*(1-Math.pow(1-k,3));
  ctx.save();ctx.translate(W/2,H*.3);ctx.scale(sc,sc);
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle=clear?'#7dd87d':'#eaf2ff';ctx.font="800 48px 'Segoe UI',system-ui,sans-serif";ctx.letterSpacing='5px';
  ctx.fillText(clear?'PLANET CLEARED':'GAME OVER',0,0);ctx.letterSpacing='0px';
  ctx.restore();
  ctx.textAlign='center';ctx.textBaseline='middle';
  const pl=PLANETS[planetIdx],df=diffIdx===3?{accent:'#ffd54a',name:'ENDLESS'}:DIFFS[diffIdx];
  ctx.fillStyle=df.accent;ctx.font="700 15px 'Segoe UI',system-ui,sans-serif";ctx.letterSpacing='2px';
  ctx.fillText(df.name+'  -  '+pl.name,W/2,H*.38);ctx.letterSpacing='0px';
  ctx.fillStyle='#7d8db0';ctx.font="700 13px 'Segoe UI',system-ui,sans-serif";ctx.letterSpacing='3px';
  ctx.fillText('SCORE',W/2,H*.44);ctx.letterSpacing='0px';
  ctx.fillStyle='#eaf2ff';ctx.font="800 38px 'Segoe UI',system-ui,sans-serif";
  ctx.fillText(String(score),W/2,H*.495);
  ctx.fillStyle='#8fa3c8';ctx.font="600 15px 'Segoe UI',system-ui,sans-serif";
  ctx.fillText('STARS '+(diffIdx===3?starsCaught:(starsCaught+'/'+target))+'    BEST '+(diffIdx===3?endBest:best),W/2,H*.545);
  if(newBest){const ca=.65+.35*Math.sin(tNow*6);ctx.globalAlpha=ca;ctx.fillStyle='#ffd54a';ctx.font="800 15px 'Segoe UI',system-ui,sans-serif";ctx.fillText('NEW BEST!',W/2,H*.545+24);ctx.globalAlpha=1;}
  for(const b of btns)drawBtn(b,b.label,true);
}

/* ================= main ================= */
function update(dt){
  updateSky(dt);
  if(splashT>0){splashT-=dt;return;}
  if(mode==='menu'){
    for(let i=0;i<3;i++){const h=dist(mx,my,m.cxs[i],m.cy)<m.R*1.6?1:0;hoverAmt[i]+=(h-hoverAmt[i])*Math.min(1,dt*10);}
    for(let i=0;i<9;i++)hoverAmt[i]+=(0-hoverAmt[i])*Math.min(1,dt*10);
    endlessHov+=(0-endlessHov)*Math.min(1,dt*10);
  }else if(mode==='diff'){
    for(let i=0;i<3;i++)hoverAmt[i]+=(0-hoverAmt[i])*Math.min(1,dt*10);
    endlessHov+=(hitBtn(endlessCard,mx,my)?1:0-endlessHov)*Math.min(1,dt*10);
    diffHov=-1;
    for(let c=0;c<3;c++){
      const card=diffCards[c];
      if(mx>=card.x&&mx<=card.x+card.w&&my>=card.y&&my<=card.y+card.h)diffHov=c;
      for(let i=0;i<3;i++){
        const o=orbRect(card,i);
        const unlocked=i<=Math.min(3,progress[DIFFS[c].id]);
        const h=(unlocked&&dist(mx,my,o.x,o.y)<o.r*1.5)?1:0;
        hoverAmt[c*3+i]+=(h-hoverAmt[c*3+i])*Math.min(1,dt*10);
      }
    }
  }else{
    for(let i=0;i<9;i++)hoverAmt[i]+=(0-hoverAmt[i])*Math.min(1,dt*10);
    endlessHov+=(0-endlessHov)*Math.min(1,dt*10);
    if(mode==='upgrade'){upgHov=-1;for(let i=0;i<upgCards.length;i++){if(hitBtn(upgCards[i],mx,my))upgHov=i;}}
  }
  if(mode==='play'&&!paused)updatePlay(dt);
  else if(mode==='over'||mode==='clear')updateEnd(dt);
  updateFx(dt);
}
function draw(){
  ctx.save();
  if(shakeT>0)ctx.translate((Math.random()-.5)*9*shakeT,(Math.random()-.5)*9*shakeT);
  if(splashT>0){drawSplash();ctx.restore();return;}
  if(mode==='menu')drawMenu();
  else if(mode==='diff')drawDiff();
  else if(mode==='play')drawPlay();
  else if(mode==='upgrade')drawUpgrade();
  else if(mode==='clear')drawEnd(true);
  else drawEnd(false);
  drawSettingsUI();
  ctx.restore();
}
function frame(ts){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(ts-last)/1000);
  last=ts;tNow+=dt;
  if(!paused||mode!=='play')update(dt);
  draw();
}
let last=performance.now();

/* ================= input ================= */
function clickAt(x,y){
  ac();
  if(splashT>0)return;
  if(handleSettingsClick(x,y))return;
  if(mode==='menu'){
    for(let i=0;i<3;i++){if(dist(x,y,m.cxs[i],m.cy)<m.R*1.35){selectHero(i);return;}}
    if(hitBtn(m.btn,x,y)){
      if(sel>=0)showDiff();
      else{float(m.btn.x+m.btn.w/2,m.btn.y-24,'CHOOSE A HERO FIRST','#ff5d6c',1.2,14);snd('warp1',.55,.35);}
    }
  }else if(mode==='diff'){
    if(hitBtn(backBtn,x,y)){toMenu();snd('warp2',1.1,.25);return;}
    if(hitBtn(endlessCard,x,y)){startEndless();return;}
    for(let c=0;c<3;c++){
      const card=diffCards[c];
      for(let i=0;i<3;i++){
        const o=orbRect(card,i);
        if(dist(x,y,o.x,o.y)<o.r*1.35){
          if(i<=Math.min(3,progress[DIFFS[c].id])){snd('warp2',1.25,.3);startLevel(c,i);}
          else{snd('warp1',.55,.3);float(o.x,o.y-20,'LOCKED','#8fa3c8',1.1,12);}
          return;
        }
      }
    }
  }else if(mode==='upgrade'){
    for(let i=0;i<upgCards.length;i++){if(hitBtn(upgCards[i],x,y)){pickUpgrade(i);return;}}
  }else if(mode==='over'||mode==='clear'){
    for(const b of btns){if(hitBtn(b,x,y)){b.cb();return;}}
  }
}
cv.addEventListener('mousemove',e=>{
  mx=e.clientX;my=e.clientY;
  if(drag){dragX=mx;dragY=my;}
  if(settingsDrag==='vol')setVolFromX(mx);
  let ptr=false;
  if(mode==='menu'){
    for(let i=0;i<3;i++)if(dist(mx,my,m.cxs[i],m.cy)<m.R*1.6)ptr=true;
    if(sel>=0&&hitBtn(m.btn,mx,my))ptr=true;
  }else if(mode==='diff'){
    if(hitBtn(backBtn,mx,my))ptr=true;
    for(let c=0;c<3;c++)for(let i=0;i<3;i++){const o=orbRect(diffCards[c],i);if(i<=Math.min(3,progress[DIFFS[c].id])&&dist(mx,my,o.x,o.y)<o.r*1.5)ptr=true;}
  }else if(mode==='play'&&!paused&&!drag&&dist(mx,my,P.x,P.y)<P.r*1.6){ptr=true;}
  else if(mode==='over'||mode==='clear'){ptr=btns.some(b=>hitBtn(b,mx,my));}
  const g=setGearRect();
  if(dist(mx,my,g.x,g.y)<g.r+6||(settingsOpen&&(hitBtn(setToggleRect(),mx,my)||hitBtn(setSliderRect(),mx,my))))ptr=true;
  cv.style.cursor=drag?'grabbing':(ptr?(mode==='play'?'grab':'pointer'):'default');
});
cv.addEventListener('mousedown',e=>{
  if(mode==='play'&&!paused&&dist(e.clientX,e.clientY,P.x,P.y)<P.r*1.6){drag=true;dragX=e.clientX;dragY=e.clientY;}
  else clickAt(e.clientX,e.clientY);
});
addEventListener('mouseup',()=>{drag=false;settingsDrag=null;});
cv.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0];mx=t.clientX;my=t.clientY;if(mode==='play'&&!paused){drag=true;dragX=t.clientX;dragY=t.clientY;}else clickAt(t.clientX,t.clientY);},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();const t=e.touches[0];mx=t.clientX;my=t.clientY;if(drag){dragX=t.clientX;dragY=t.clientY;}},{passive:false});
cv.addEventListener('touchend',e=>{e.preventDefault();drag=false;},{passive:false});
addEventListener('keydown',e=>{
  ac();
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault();
  if(splashT>0)return;
  if(mode==='play'&&(e.key==='p'||e.key==='P'||e.key==='Escape')){paused=!paused;snd('warp2',.85,.2);return;}
  if(mode==='play'&&(e.key==='m'||e.key==='M')){muted=!muted;if(musicGain)musicGain.gain.setTargetAtTime(muted?0:musicVol,ac().currentTime,.05);return;}
  if(mode==='menu'){
    if(e.key==='1')selectHero(0);
    else if(e.key==='2')selectHero(1);
    else if(e.key==='3')selectHero(2);
    else if((e.key==='Enter'||e.key===' ')&&sel>=0)showDiff();
  }else if(mode==='diff'){
    if(e.key==='Escape'){toMenu();return;}
    if(e.key==='4'){startEndless();return;}
    if(e.key==='1')diffHov=0;
    else if(e.key==='2')diffHov=1;
    else if(e.key==='3')diffHov=2;
    else if((e.key==='Enter'||e.key===' ')&&diffHov>=0)startLevel(diffHov,0);
  }else if(mode==='upgrade'){
    if(e.key==='Escape'){skipUpgrade();return;}
    const ui=['1','2','3'].indexOf(e.key);
    if(ui>=0)pickUpgrade(ui);
    return;
  }
  keys[e.key]=true;keys[e.key.toLowerCase()]=true;
});
addEventListener('keyup',e=>{keys[e.key]=false;keys[e.key.toLowerCase()]=false;});
addEventListener('resize',resize);

/* ================= boot ================= */
resize();initSky();layout();
loadSFX();
let splashT=1.9;
try{musicOn=localStorage.getItem('starcatcher_music_on')!=='0';}catch(e){}
try{musicVol=parseFloat(localStorage.getItem('starcatcher_music_vol'))||.55;musicVol=Math.max(0,Math.min(1,musicVol));}catch(e){}
window.SC={
  getState:()=>({mode,sel,diff:diffIdx,planet:planetIdx,score,lives:baseHP,baseHP,maxHP,starsCaught,target,combo,best,endBest,wave:inf?inf.wave:0,level:inf?inf.level:0,stress:inf?Math.round(inf.stress*100)/100:0,upgrades:inf?inf.upgrades:{},splash:Math.round(splashT*100)/100,stars:stars.length,projs:projs.length,px:Math.round(P.x),py:Math.round(P.y),r:P.r,paused,drag,progress}),
  select:i=>selectHero(i),
  diff:()=>showDiff(),
  endless:()=>startEndless(),
  upgrade:()=>levelUp(),
  skipSplash:()=>{splashT=0;},
  setMusic:(on,v)=>{musicOn=!!on;if(v!==undefined){musicVol=Math.max(0,Math.min(1,v));}toggleMusic();},
  start:(d,p)=>startLevel(d===undefined?diffIdx:d,p===undefined?planetIdx:p),
  menu:()=>toMenu(),
  setBaseHP:n=>{baseHP=n;},
  setTarget:n=>{target=n;},
  spawnStarAt:(x,y,type)=>{stars.push({x,y,r:16,vy:200,vx:0,rot:0,vr:1,type:type||'n'});},
  rockFire:()=>{projs.push({x:P.x,y:P.y-P.r-8,vx:0,vy:-215,r:P.r*.25,life:1.6,rot:0,vr:7});},
  best:()=>best
};
requestAnimationFrame(frame);
</script>
